[project]
authors = [{name = "Oleksandr Huziy", email = "oleksandr.huziy@ec.gc.ca"}]
name = "loadprogs_python"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/loadprogs"]

[tool.pixi.workspace]
channels = ["conda-forge", "fortiers", "file:///fs/site7/eccc/cmd/cmd_shared/slib800/conda-cmc/prod", "https://conda.modular.com/max-nightly",]
platforms = ["linux-64"]


[tool.pixi.activation]
scripts = ["scripts/load_runtime_deps.sh"]

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PYTHONPATH"
NUMEXPR_MAX_THREADS = "256"

[tool.pixi.tasks]
check-pythonpath = "echo $PYTHONPATH"
detide-field-test = "rm -f dask-worker.o* dask-worker.e*; ord_soumet ./scripts/launch_pyscript.sh -mach moira -t 10800 -args /home/olh001/Python/loadprogs_python src/loadprogs/tools/detide_mod_fields.py"
detide-field-test-reconstruct = "ord_soumet ./scripts/launch_pyscript.sh -mach moira -t 3600 -args /home/olh001/Python/loadprogs_python src/loadprogs/tools/detide_mod_fields_reconstruct.py"
detide-ciopsw-nemo36 = "ord_soumet ./scripts/launch_pyscript.sh -mach moira -t 10800 -args $(pwd) /home/olh001/Python/loadprogs_python/src/loadprogs/tests/test_detide_mod_fields/ciopsw_nemo36.py"
detide-ciopsw-nemo4 = "ord_soumet ./scripts/launch_pyscript.sh -mach moira -t 10800 -args $(pwd) /home/olh001/Python/loadprogs_python/src/loadprogs/tests/test_detide_mod_fields/ciopsw_nemo4.py"
detide-ciopse = "ord_soumet ./scripts/launch_pyscript.sh -mach moira -t 10800 -args $(pwd) /home/olh001/Python/loadprogs_python/src/loadprogs/tests/test_detide_mod_fields/ciopse.py"

[tool.pixi.dependencies]
python = ">=3.13,<3.14"
fstpy = ">=2026.8.0,<2027"
pandas = ">=3.0.5,<4"
dask = ">=2026.8.0,<2027"
joblib = ">=1.5.3,<2"
pykdtree = ">=1.4.3,<2"
xarray = ">=2026.7.0,<2027"
matplotlib = ">=3.11.1,<4"
cartopy = ">=0.25.0,<0.26"
numexpr = ">=2.14.2,<3"
utide = ">=0.3.1,<0.4"
zarr = ">=3.3.0,<4"
nest-asyncio = ">=1.6.0,<2"
pip = ">=26.2.1,<27"
cmc-io = ">=2026.9.1.dev2+g72cf6214a,<2027+0g72cf6214"
ipycytoscape = ">=1.3.3,<2"
dask-jobqueue = ">=0.9.0,<0.10"
pint = ">=0.25.3,<0.26"
pyarrow = ">=25.0.0,<26"
distributed = ">=2026.8.0,<2027"
jupyter-server-proxy = ">=4.5.0,<5"
bokeh = ">=3.10.0,<4"
tqdm = ">=4.70.0,<5"


[tool.pixi.pypi-dependencies]
loadprogs_python = { path = ".", editable = true }
ttide = {git = "https://github.com/guziy/ttide_py" }
fstd2nc = {git = "https://github.com/neishm/fstd2nc", rev = "0.20260225.0"}

[tool.pixi.feature.dev.dependencies]
ipython = ">=9.16.1,<10"

[tool.pixi.environments]
dev = ["dev"]

[tool.hatch.metadata]
allow-direct-references = true


