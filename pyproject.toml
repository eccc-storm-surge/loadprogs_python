[project]
authors = [{name = "Oleksandr Huziy", email = "oleksandr.huziy@ec.gc.ca"}]
name = "loadprogs_python"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/loadprogs"]

[tool.pixi.workspace]
channels = ["conda-forge", "fortiers",]
platforms = ["linux-64"]


[tool.pixi.activation]
scripts = ["scripts/load_runtime_deps.sh"]

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PYTHONPATH"

[tool.pixi.tasks]
check-pythonpath = "echo $PYTHONPATH"

[tool.pixi.dependencies]
python = ">=3.14.6,<3.15"
fstpy = ">=2026.8.0,<2027"
pandas = ">=3.0.5,<4"
dask = ">=2026.7.1,<2027"
joblib = ">=1.5.3,<2"
pykdtree = ">=1.4.3,<2"
xarray = ">=2026.7.0,<2027"
matplotlib = ">=3.11.1,<4"
cartopy = ">=0.25.0,<0.26"


[tool.pixi.pypi-dependencies]
loadprogs_python = { path = ".", editable = true }
ttide = {git = "https://github.com/guziy/ttide_py" }
fstd2nc = {git = "https://github.com/neishm/fstd2nc", rev = "0.20260225.0"}

[tool.hatch.metadata]
allow-direct-references = true

